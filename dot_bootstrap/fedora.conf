# fedora-setup.conf - Configuration for Fedora bootstrap script
# Format: Simple shell-compatible key=value and array syntax
# This file is processed through chezmoi templates

# ============================================================================
# Git Identity (from chezmoi templates)
# ============================================================================
GIT_NAME="{{ .git_name }}"
GIT_EMAIL="{{ .git_email }}"
GITHUB_USER="{{ .github_user }}"

# ============================================================================
# External URLs and APIs
# ============================================================================
GITHUB_API_USER="https://api.github.com/user"
GITHUB_API_KEYS="https://api.github.com/user/keys"
GITHUB_TOOLBOX_DOWNLOAD="https://data.services.jetbrains.com/products/download?platform=linux&code=TBA"

# ============================================================================
# System Paths
# ============================================================================
SSH_KEY="$HOME/.ssh/id_ed25519"
GRUB_FILE="/etc/default/grub"
DCONF_FILE="bootstrap/dconf.ini"

# ============================================================================
# COPR Repositories (Fedora Community Projects)
# ============================================================================
COPR_REPOS=(
  "jdxcode/mise"
  "dejan/lazygit"
  "varlad/zellij"
  "imput/helium"
)

# ============================================================================
# System Packages to Install
# ============================================================================
# Organized by category for clarity
SYSTEM_PACKAGES=(
  # Version Control & Git
  git
  git-lfs

  # Editor & Terminal
  vim-enhanced
  vim-default-editor
  zsh
  zoxide
  zellij

  # Shell Tools & Utilities
  lazygit
  ripgrep
  fzf
  bat
  wl-clipboard
  fd-find
  eza
  tldr
  atuin

  # Desktop Environment
  gnome-extensions-app
  gnome-tweaks
  helium-bin
  nextcloud-client

  # Media & Archives
  ffmpeg
  7zip

  # Development & Build Tools
  jq
  yq
  podman
  make
  code
  mise

  # System Management
  btop
  snapper
  btrfs-assistant
  wireguard-tools
)

# ============================================================================
# Flatpak Applications
# ============================================================================
FLATPAK_APPS=(
  "com.usebruno.Bruno"
  "io.dbeaver.DBeaverCommunity"
  "com.spotify.Client"
  "com.rustdesk.RustDesk"
  "com.mikrotik.WinBox"
  "org.localsend.localsend_app"
  "org.signal.Signal"
  "org.mozilla.Thunderbird"
  "org.gnome.seahorse.Application"
  "de.bund.ausweisapp.ausweisapp2"
)

# ============================================================================
# JetBrains Toolbox Runtime Dependencies
# ============================================================================
JETBRAINS_DEPS=(
  libXi
  libXrender
  libXtst
  fontconfig
  gtk3
  tar
  dbus-daemon
)
